<div class="editor" *ngIf="note; else emptyState">
  <div class="toolbar">
    <input class="title" [(ngModel)]="title" placeholder="Note title" />
    <div class="spacer"></div>
    <button class="delete" (click)="onDelete()">Delete</button>
    <button class="save" (click)="onSave()">Save</button>
  </div>
  <textarea class="content" [(ngModel)]="content" placeholder="Write your note here..."></textarea>
</div>

<ng-template #emptyState>
  <div class="empty">
    <p>Select a note from the left or create a new one to begin.</p>
  </div>
</ng-template>
